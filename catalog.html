<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digital Racer — Full Archive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;900&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root { --bg: #050505; --surface: #111111; --surface2: #161616; --border: #222222; --text: #ffffff; --muted: #888888; --accent: #d4af37; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: 'Open Sans', sans-serif; overflow-x: hidden; }
h1, h2, h3 { font-family: 'Montserrat', sans-serif; }
nav { display: flex; justify-content: space-between; align-items: center; padding: 18px 5vw; border-bottom: 1px solid var(--border); background: rgba(5, 5, 5, 0.95); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 100; gap: 20px; flex-wrap: wrap; }
.logo { font-size: 1.1rem; font-weight: 900; letter-spacing: 4px; text-transform: uppercase; color: var(--text); text-decoration: none; white-space: nowrap; }
.logo span { color: var(--accent); }
.nav-search { display: flex; align-items: center; background: var(--surface2); border: 1px solid var(--border); border-radius: 4px; padding: 6px 12px; width: 300px; max-width: 100%; transition: border-color 0.2s; }
.nav-search:focus-within { border-color: var(--accent); }
.nav-search input { background: transparent; border: none; outline: none; color: var(--text); font-size: 0.85rem; width: 100%; font-family: 'Open Sans', sans-serif; }
.nav-search button { background: transparent; border: none; color: var(--accent); cursor: pointer; font-size: 0.85rem; font-weight: 700; text-transform: uppercase; margin-left: 8px; }
.nav-links { display: flex; gap: 20px; align-items: center; }
.nav-link { color: var(--muted); text-decoration: none; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 2px; font-weight: 600; transition: color 0.2s; white-space: nowrap; }
.nav-link:hover { color: var(--accent); }

.catalog-container { width: 100%; padding: 50px 5vw; }
.catalog-top-bar { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 40px; flex-wrap: wrap; gap: 20px; border-bottom: 1px solid var(--border); padding-bottom: 25px; }
.page-title { font-size: clamp(2rem, 3.5vw, 3rem); font-weight: 900; text-transform: uppercase; letter-spacing: -1px; }
.page-title span { color: var(--accent); }
.controls-wrapper { display: flex; align-items: center; gap: 15px; flex-wrap: wrap; }
.filter-group { display: flex; gap: 8px; flex-wrap: wrap; }
.filter-btn { background: var(--surface); border: 1px solid var(--border); color: var(--muted); padding: 10px 18px; font-family: 'Montserrat', sans-serif; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; font-size: 0.75rem; border-radius: 4px; cursor: pointer; transition: all 0.2s; }
.filter-btn.active, .filter-btn:hover { border-color: var(--accent); color: var(--accent); background: rgba(212, 175, 55, 0.08); }
.sort-select { background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 10px 16px; font-family: 'Open Sans', sans-serif; font-size: 0.8rem; border-radius: 4px; cursor: pointer; outline: none; transition: border-color 0.2s; font-weight: 600; }
.sort-select:focus { border-color: var(--accent); }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 30px; }
.product-card { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; overflow: hidden; text-decoration: none; color: var(--text); display: flex; flex-direction: column; transition: border-color 0.3s; opacity: 0; transform: translateY(20px); }
.product-card:hover { border-color: var(--accent); }
.prod-img-wrap { width: 100%; aspect-ratio: 4/3; background: var(--surface2); position: relative; overflow: hidden; }
.prod-img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s ease; }
.product-card:hover .prod-img { transform: scale(1.05); }
.prod-badge { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.8); border: 1px solid var(--accent); color: var(--accent); padding: 4px 10px; font-size: 0.65rem; text-transform: uppercase; font-weight: 700; letter-spacing: 1px; }

.prod-content { padding: 20px; display: flex; flex-direction: column; flex-grow: 1; }
.prod-category { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 2px; color: var(--accent); font-weight: 700; margin-bottom: 8px; }
.prod-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 16px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.prod-footer { margin-top: auto; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border); padding-top: 16px; }
.prod-price { font-size: 1.25rem; font-weight: 800; color: var(--accent); font-family: 'Montserrat', sans-serif; }
.prod-btn { background: var(--surface2); color: var(--text); padding: 8px 16px; border-radius: 4px; font-size: 0.8rem; font-weight: 700; text-transform: uppercase; border: 1px solid var(--border); transition: all 0.2s; }
.product-card:hover .prod-btn { background: var(--accent); color: #000; border-color: var(--accent); }
footer { background: var(--surface); border-top: 1px solid var(--border); padding: 40px 5vw; text-align: center; color: var(--muted); font-size: 0.9rem; margin-top: 80px; }
@media(max-width: 850px) { nav { flex-direction: column; align-items: stretch; } .nav-search { width: 100%; } .grid { grid-template-columns: repeat(2, 1fr); gap: 15px; } .catalog-top-bar { flex-direction: column; align-items: flex-start; } .controls-wrapper { width: 100%; flex-direction: column; align-items: stretch; } .filter-group { justify-content: space-between; } }
</style>
</head>
<body>

<nav>
  <a href="index.html" class="logo">Digital<span>.</span>Racer</a>
  <div class="nav-search">
    <input type="text" id="search-input" placeholder="Search accounts, skins, UC...">
    <button id="search-btn">Search</button>
  </div>
  <div class="nav-links">
    <a href="index.html" class="nav-link">Home</a>
  </div>
</nav>

<div class="catalog-container">
  <div class="catalog-top-bar">
    <h1 class="page-title">Full <span>Archive</span></h1>
    <div class="controls-wrapper">
      <div class="filter-group">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="Account">Accounts</button>
        <button class="filter-btn" data-filter="UC Top-Up">UC Top-Ups</button>
        <button class="filter-btn" data-filter="Car Card">Car Skins</button>
      </div>
      <select class="sort-select" id="sort-select">
        <option value="default">Sort by: Default</option>
        <option value="high-low">Price: High to Low</option>
        <option value="low-high">Price: Low to High</option>
      </select>
    </div>
  </div>
  <div class="grid" id="full-catalog">
    <p style="color: var(--muted);">Loading inventory...</p>
  </div>
</div>
<footer><p>© 2026 Digital Racer. All rights reserved.</p></footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
  let allProducts = []; let currentCategory = 'all'; let currentSort = 'default'; let searchQuery = '';
  const urlParams = new URLSearchParams(window.location.search);
  if (urlParams.has('search')) { searchQuery = urlParams.get('search').toLowerCase(); document.getElementById('search-input').value = urlParams.get('search'); }

  function handleNavbarSearch() { const query = document.getElementById('search-input').value.trim(); searchQuery = query.toLowerCase(); processAndRender(); }
  document.getElementById('search-btn').addEventListener('click', handleNavbarSearch);
  document.getElementById('search-input').addEventListener('keypress', (e) => { if (e.key === 'Enter') handleNavbarSearch(); });

  function formatImagePath(rawPath) {
    if (!rawPath) return "";
    let cleanPath = rawPath.trim();
    if (cleanPath.startsWith('http') || cleanPath.startsWith('/')) return cleanPath;
    return '/' + cleanPath;
  }

  function createCardHTML(product) {
    const rawImg = product.image || product.thumbnail || product.img || product.photo || product.picture || "";
    const bgImage = formatImagePath(rawImg);
    const badgeHtml = product.badge ? `<div class="prod-badge">${product.badge}</div>` : '';
    return `
      <a href="product.html?item=${encodeURIComponent(product.title)}" class="product-card item-card" data-category="${product.category}">
        <div class="prod-img-wrap"><img src="${bgImage}" class="prod-img" alt="${product.title}" onerror="this.style.display='none'"> ${badgeHtml}</div>
        <div class="prod-content">
          <div class="prod-category">${product.category || 'Asset'}</div>
          <div class="prod-title">${product.title}</div>
          <div class="prod-footer">
            <div class="prod-price">Rs. ${product.price}</div>
            <div class="prod-btn">View</div>
          </div>
        </div>
      </a>`;
  }

  function processAndRender() {
    let result = currentCategory === 'all' ? [...allProducts] : allProducts.filter(p => p.category === currentCategory);
    if (searchQuery) result = result.filter(p => p.title.toLowerCase().includes(searchQuery) || (p.description && p.description.toLowerCase().includes(searchQuery)));
    if (currentSort === 'high-low') result.sort((a, b) => parseFloat(b.price || 0) - parseFloat(a.price || 0));
    else if (currentSort === 'low-high') result.sort((a, b) => parseFloat(a.price || 0) - parseFloat(b.price || 0));
    
    const container = document.getElementById('full-catalog');
    if (result.length === 0) { container.innerHTML = `<p style="color: var(--muted);">No assets found matching your search.</p>`; return; }
    container.innerHTML = result.map(p => createCardHTML(p)).join('');
    gsap.to('.item-card', { opacity: 1, y: 0, duration: 0.5, stagger: 0.04, ease: 'power3.out' });
  }

  fetch('/inventory.json')
    .then(async response => {
      if (!response.ok) throw new Error(`File Not Found (HTTP ${response.status}).`);
      const text = await response.text();
      try { return JSON.parse(text); } 
      catch (e) { 
        const safeText = text.replace(/</g, '&lt;').replace(/>/g, '&gt;').substring(0, 150);
        throw new Error(`Data format error. Cloudflare returned this instead of JSON:<br><br><code style="color: #ffcccc;">${safeText}...</code>`); 
      }
    })
    .then(data => { allProducts = Array.isArray(data) ? data : (data.items || data.products || data.inventory || []); processAndRender(); })
    .catch(error => {
      console.error("Diagnostic Error:", error);
      document.getElementById('full-catalog').innerHTML = `<div style="background: rgba(255,0,0,0.1); border: 1px solid red; padding: 15px; color: #ff4d4d; border-radius: 6px; font-weight: bold;">🚨 SYSTEM ERROR: <br><br>${error.message}</div>`;
    });

  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      e.target.classList.add('active'); currentCategory = e.target.getAttribute('data-filter'); processAndRender();
    });
  });
  document.getElementById('sort-select').addEventListener('change', (e) => { currentSort = e.target.value; processAndRender(); });
</script>
</body>
</html>
