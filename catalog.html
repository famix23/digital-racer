<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>All Products Catalog - Digital Racer</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg: #060b14;          
  --surface: #0c1424;     
  --surface2: #141f36;    
  --line: #1c2a45;        
  --accent: #d4af37;      
  --accent-dim: #aa8c2c;  
  --gold: #f3c93e;        
  --text: #ffffff;        
  --muted: #9ba4b5;       
  
  /* Category Tag Colors */
  --c-account: #00f5df;
  --c-uc: #ffcc33;
  --c-car: #ff3800;
  --c-hack: #d946ef;
  
  --radius: 12px;         
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Open Sans', sans-serif;
  font-size: 15px; 
  line-height: 1.5;
  overflow-x: hidden;
}
h1,h2,h3,h4{font-family:'Montserrat', sans-serif;}

/* ---------- Navbar ---------- */
nav {
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  padding: 16px 40px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: sticky;
  top: 0;
  z-index: 50;
  box-shadow: 0 4px 20px rgba(0,0,0,0.4);
}
.logo {
  font-family: 'Montserrat', sans-serif;
  font-weight: 800;
  font-size: 1.4rem;
  color: var(--gold);
  text-decoration: none;
  letter-spacing: 2px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.logo::before {
  content: "";
  display: block;
  width: 12px; height: 12px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 10px var(--accent);
}
.nav-links a {
  color: var(--text);
  text-decoration: none;
  font-weight: 600;
  margin-left: 24px;
  transition: color 0.2s;
}
.nav-links a:hover, .nav-links a.active { color: var(--gold); }

/* ---------- Breadcrumb ---------- */
.breadcrumb {
  max-width: 1360px;
  margin: 20px auto 0;
  padding: 0 20px;
  color: var(--muted);
  font-size: 0.85rem;
}
.breadcrumb a { color: var(--c-account); text-decoration: none; }
.breadcrumb span { margin: 0 8px; }

/* ---------- Main Layout ---------- */
.catalog-wrapper {
  max-width: 1360px;
  margin: 20px auto 60px;
  padding: 0 20px;
  display: flex;
  gap: 30px;
  align-items: flex-start;
}

/* ---------- Sidebar Filters ---------- */
.sidebar {
  width: 280px;
  flex-shrink: 0;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 24px;
  position: sticky;
  top: 90px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.3);
}
.filter-header {
  font-size: 1.2rem;
  font-weight: 700;
  margin-bottom: 24px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--line);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.clear-btn {
  font-size: 0.8rem;
  color: var(--muted);
  background: none;
  border: none;
  cursor: pointer;
  font-family: inherit;
  transition: color 0.2s;
}
.clear-btn:hover { color: var(--gold); }
.filter-group {
  margin-bottom: 28px;
}
.filter-group h4 {
  font-size: 0.95rem;
  color: var(--muted);
  margin-bottom: 14px;
  text-transform: uppercase;
  letter-spacing: 1px;
}
.filter-option {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 12px;
  cursor: pointer;
  color: var(--text);
  font-size: 0.95rem;
  transition: color 0.2s;
}
.filter-option:hover { color: var(--gold); }
.filter-option input[type="checkbox"] {
  accent-color: var(--accent);
  width: 18px; height: 18px;
  cursor: pointer;
}
/* Price Range Inputs */
.price-range {
  display: flex;
  gap: 10px;
  align-items: center;
}
.price-range input {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--line);
  color: var(--text);
  padding: 10px 12px;
  border-radius: 6px;
  font-family: inherit;
  outline: none;
  transition: border-color 0.2s;
}
.price-range input:focus { border-color: var(--accent); }
.price-range span { color: var(--muted); }

/* ---------- Main Content Grid ---------- */
.main-content {
  flex: 1;
  min-width: 0;
}
.catalog-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 24px;
  background: var(--surface);
  padding: 20px 24px;
  border-radius: var(--radius);
  border: 1px solid var(--line);
  box-shadow: 0 4px 15px rgba(0,0,0,0.2);
}
.catalog-header h1 {
  font-size: 1.6rem;
  color: var(--text);
}
.catalog-header .results-count {
  color: var(--muted);
  font-size: 0.95rem;
  margin-top: 4px;
}
.sort-box {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 0.95rem;
  color: var(--muted);
}
.sort-box select {
  background: var(--bg);
  color: var(--text);
  border: 1px solid var(--line);
  padding: 10px 14px;
  border-radius: 6px;
  font-family: inherit;
  font-weight: 600;
  outline: none;
  cursor: pointer;
}

/* Product Grid */
.products-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 24px;
}

/* Product Card */
.product-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
  transition: all 0.3s ease;
  display: flex;
  flex-direction: column;
  text-decoration: none;
  color: inherit;
  box-shadow: 0 6px 18px rgba(0,0,0,0.2);
}
.product-card:hover {
  transform: translateY(-6px);
  border-color: var(--accent);
  box-shadow: 0 12px 30px rgba(212, 175, 55, 0.15);
}
.prod-image {
  width: 100%;
  aspect-ratio: 16/9;
  background: var(--surface2);
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--muted);
  font-size: 2.5rem;
  border-bottom: 1px solid var(--line);
  background-size: cover;
  background-position: center;
}
.prod-image .img-badge {
  position: absolute;
  bottom: 10px; right: 10px;
  background: rgba(0,0,0,0.8);
  padding: 6px 10px;
  border-radius: 6px;
  font-size: 0.75rem;
  font-weight: 700;
  color: #fff;
  border: 1px solid rgba(255,255,255,0.1);
}
.prod-details {
  padding: 20px;
  display: flex;
  flex-direction: column;
  flex-grow: 1;
}
.prod-tags {
  display: flex;
  gap: 8px;
  margin-bottom: 12px;
  flex-wrap: wrap;
}
.tag {
  background: var(--bg);
  border: 1px solid;
  padding: 4px 10px;
  border-radius: 6px;
  font-size: 0.7rem;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
/* Category Specific Tag Colors */
.tag.t-account { color: var(--c-account); border-color: rgba(0, 245, 223, 0.3); }
.tag.t-uc { color: var(--c-uc); border-color: rgba(255, 204, 51, 0.3); }
.tag.t-car { color: var(--c-car); border-color: rgba(255, 56, 0, 0.3); }
.tag.t-hack { color: var(--c-hack); border-color: rgba(217, 70, 239, 0.3); }

.prod-title {
  font-size: 1.05rem;
  font-weight: 600;
  line-height: 1.5;
  margin-bottom: 16px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.prod-footer {
  margin-top: auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-top: 1px dashed var(--line);
  padding-top: 16px;
}
.prod-price {
  font-size: 1.4rem;
  font-weight: 800;
  color: var(--gold);
}
.prod-price span { font-size: 0.85rem; color: var(--muted); font-weight: 600; }
.prod-view-btn {
  background: var(--surface2);
  color: var(--text);
  padding: 8px 16px;
  border-radius: 6px;
  font-size: 0.85rem;
  font-weight: 700;
  transition: all 0.2s;
}
.product-card:hover .prod-view-btn {
  background: linear-gradient(90deg, var(--accent), var(--gold));
  color: var(--bg);
  box-shadow: 0 4px 10px rgba(212, 175, 55, 0.3);
}

@media(max-width: 950px) {
  .catalog-wrapper { flex-direction: column; }
  .sidebar { width: 100%; position: static; }
  .products-grid { grid-template-columns: repeat(auto-fill, minmax(100%, 1fr)); }
}
</style>
</head>
<body>

<nav>
  <a href="index.html" class="logo">DIGITAL RACER</a>
  <div class="nav-links">
    <a href="index.html">Home</a>
    <a href="catalog.html" class="active">Catalog</a>
    <a href="#">Support</a>
  </div>
</nav>

<div class="breadcrumb">
  <a href="index.html">Home</a> <span>/</span> 
  PUBG Mobile Store <span>/</span> 
  All Products
</div>

<div class="catalog-wrapper">
  
  <!-- Left Sidebar Filters -->
  <aside class="sidebar">
    <div class="filter-header">
      Filters
      <button class="clear-btn">Clear All</button>
    </div>

    <!-- MAIN CATEGORIES FILTER -->
    <div class="filter-group">
      <h4>Main Categories</h4>
      <label class="filter-option"><input type="checkbox" checked> 👤 PUBG Accounts</label>
      <label class="filter-option"><input type="checkbox" checked> 🪙 PUBG UC</label>
      <label class="filter-option"><input type="checkbox" checked> 🚗 PUBG Car Cards</label>
      <label class="filter-option"><input type="checkbox" checked> ⚙️ Sensitivity & Hacks</label>
    </div>

    <div class="filter-group">
      <h4>Price Range (PKR)</h4>
      <div class="price-range">
        <input type="number" placeholder="Min">
        <span>-</span>
        <input type="number" placeholder="Max">
      </div>
    </div>

    <div class="filter-group">
      <h4>Delivery Time</h4>
      <label class="filter-option"><input type="checkbox"> ⚡ Instant Delivery</label>
      <label class="filter-option"><input type="checkbox"> ⏳ 10 - 30 Mins</label>
      <label class="filter-option"><input type="checkbox"> 🕒 1 - 2 Hours</label>
    </div>
  </aside>

  <!-- Right Main Content -->
  <main class="main-content">
    
    <div class="catalog-header">
      <div>
        <h1>Digital Racer Store</h1>
        <div class="results-count">Showing all available categories</div>
      </div>
      <div class="sort-box">
        <label>Sort by:</label>
        <select>
          <option>Trending First</option>
          <option>Price: Low to High</option>
          <option>Price: High to Low</option>
          <option>Newest Arrivals</option>
        </select>
      </div>
    </div>

    <div class="products-grid" id="product-container">
      <p style="color: var(--muted); grid-column: 1 / -1;">Loading live inventory...</p>
    </div>
  </main>

</div>

<script>
  // Fetch the inventory data saved by the CMS
  fetch('/inventory.json')
    .then(response => {
      if (!response.ok) throw new Error('Inventory not found. Add products in the admin panel first!');
      return response.json();
    })
    .then(data => {
      const container = document.getElementById('product-container');
      container.innerHTML = ''; // Clear loading text

      // Access the items list defined in config.yml
      const products = data.items;

      if (!products || products.length === 0) {
        container.innerHTML = '<p style="color: var(--muted); grid-column: 1 / -1;">No products available yet. Add some in the admin panel!</p>';
        return;
      }

      // Loop through each product and draw the card
      products.forEach(product => {
        
        // Match the category to our CSS tag colors
        let tagColor = '';
        if(product.category === 'Account') tagColor = 't-account';
        if(product.category === 'UC Top-Up') tagColor = 't-uc';
        if(product.category === 'Car Card') tagColor = 't-car';
        if(product.category === 'Hacks & Sensitivity') tagColor = 't-hack';

        // Handle the background image
        const bgImage = product.thumbnail ? `background-image: url('${product.thumbnail}'); background-size: cover; background-position: center;` : '';
        const fallbackEmoji = !product.thumbnail ? '📦' : '';

        // Build the HTML card dynamically
        const cardHTML = `
          <a href="product.html?item=${encodeURIComponent(product.title)}" class="product-card">
            <div class="prod-image" style="${bgImage}">
              ${fallbackEmoji}
              <span class="img-badge">${product.badge || ''}</span>
            </div>
            <div class="prod-details">
              <div class="prod-tags">
                <span class="tag ${tagColor}">${product.category ? product.category.toUpperCase() : 'STORE ITEM'}</span>
                <span class="tag" style="color:var(--muted); border-color:var(--line);">${product.tag || 'GLOBAL'}</span>
              </div>
              <div class="prod-title">${product.title}</div>
              <div class="prod-footer">
                <div class="prod-price"><span>Rs.</span> ${product.price}</div>
                <div class="prod-view-btn">View</div>
              </div>
            </div>
          </a>
        `;
        container.insertAdjacentHTML('beforeend', cardHTML);
      });
    })
    .catch(error => {
      console.error(error);
      document.getElementById('product-container').innerHTML = 
        `<p style="color: var(--muted); grid-column: 1 / -1;">${error.message}</p>`;
    });
</script>

</body>
</html>
