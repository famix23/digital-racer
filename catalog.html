<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Digital Racer — Full Archive</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;800;900&family=Open+Sans:wght@300;400;600&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #050505;
  --surface: #111111;
  --border: #2a2a2a;
  --text: #ffffff;
  --muted: #7a7a7a;
  --accent: #d4af37;
}

* { box-sizing: border-box; margin: 0; padding: 0; cursor: none !important; }
html { scroll-behavior: initial; }
body { background: var(--bg); color: var(--text); font-family: 'Open Sans', sans-serif; overflow-x: hidden; -webkit-font-smoothing: antialiased; }
h1, h2, h3 { font-family: 'Montserrat', sans-serif; }

/* Custom Cursor */
.cursor-dot { width: 8px; height: 8px; background: var(--accent); position: fixed; border-radius: 50%; top: 0; left: 0; transform: translate(-50%, -50%); z-index: 9999; pointer-events: none; }
.cursor-outline { width: 40px; height: 40px; border: 1px solid rgba(212, 175, 55, 0.5); position: fixed; border-radius: 50%; top: 0; left: 0; transform: translate(-50%, -50%); z-index: 9998; pointer-events: none; transition: width 0.2s, height 0.2s, background 0.2s; }

/* Navigation */
nav { padding: 40px 10vw; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
.logo { font-size: 1.1rem; font-weight: 800; letter-spacing: 4px; text-transform: uppercase; color: var(--text); text-decoration: none; }
.logo span { color: var(--accent); }

/* Header & Filters */
.header-area { padding: 80px 10vw 40px; }
.page-title { font-size: clamp(3rem, 6vw, 5rem); font-weight: 900; text-transform: uppercase; letter-spacing: -1px; margin-bottom: 40px; }
.filters { display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 40px; }
.filter-btn { background: transparent; border: 1px solid var(--border); color: var(--muted); padding: 10px 24px; font-family: 'Montserrat', sans-serif; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; font-size: 0.8rem; transition: all 0.3s ease; }
.filter-btn.active, .filter-btn:hover { border-color: var(--accent); color: var(--accent); }

/* Grid & Cards */
.catalog-section { padding: 0 10vw 120px; min-height: 50vh; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 50px; }

.product-card { display: block; text-decoration: none; color: var(--text); position: relative; transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
.card-image-wrap { width: 100%; aspect-ratio: 4/5; overflow: hidden; background: var(--surface); position: relative; border-radius: 2px; margin-bottom: 24px; }
.card-image { width: 100%; height: 100%; object-fit: cover; transition: transform 0.7s cubic-bezier(0.16, 1, 0.3, 1), filter 0.7s; filter: grayscale(100%) contrast(1.1); }
.product-card:hover .card-image { transform: scale(1.08); filter: grayscale(0%); }
.product-card:hover { transform: translateY(-15px); }
.card-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.card-category { font-size: 0.75rem; letter-spacing: 2px; text-transform: uppercase; color: var(--accent); font-weight: 600; }
.card-title { font-size: 1.5rem; font-family: 'Montserrat', sans-serif; font-weight: 700; margin-bottom: 8px; line-height: 1.3;}
.card-price { font-size: 1.1rem; color: var(--muted); font-weight: 300; }
.badge { position: absolute; top: 16px; right: 16px; background: rgba(0,0,0,0.8); backdrop-filter: blur(4px); padding: 6px 12px; font-size: 0.7rem; letter-spacing: 1px; text-transform: uppercase; border: 1px solid var(--accent); color: var(--accent); }

/* Mobile Adjustments */
@media(max-width: 768px) {
  * { cursor: auto !important; }
  .cursor-dot, .cursor-outline { display: none; }
  .header-area, .catalog-section { padding-left: 5vw; padding-right: 5vw; }
  nav { padding-left: 5vw; padding-right: 5vw; }
}
</style>
</head>
<body>

<div class="cursor-dot"></div>
<div class="cursor-outline"></div>

<nav>
  <a href="index.html" class="logo">Digital<span>.</span>Racer</a>
  <a href="index.html" style="color:var(--text); text-decoration:none; font-size:0.85rem; letter-spacing:2px; text-transform:uppercase;">Back to Home</a>
</nav>

<div class="header-area">
  <h1 class="page-title reveal-text">The Archive.</h1>
  <div class="filters">
    <button class="filter-btn active" data-filter="all">All Assets</button>
    <button class="filter-btn" data-filter="Account">Accounts</button>
    <button class="filter-btn" data-filter="UC Top-Up">UC Top-Ups</button>
    <button class="filter-btn" data-filter="Car Card">Car Skins</button>
  </div>
</div>

<section class="catalog-section">
  <div class="grid" id="full-catalog">
    <p style="color: var(--muted); font-size: 1.2rem; font-weight: 300;">Loading assets...</p>
  </div>
</section>

<!-- Scripts -->
<script src="https://unpkg.com/lenis@1.1.18/dist/lenis.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

<script>
  // Cursor Logic
  const cursorDot = document.querySelector('.cursor-dot');
  const cursorOutline = document.querySelector('.cursor-outline');
  window.addEventListener('mousemove', (e) => {
    const posX = e.clientX; const posY = e.clientY;
    cursorDot.style.left = `${posX}px`; cursorDot.style.top = `${posY}px`;
    cursorOutline.animate({ left: `${posX}px`, top: `${posY}px` }, { duration: 500, fill: "forwards" });
  });
  document.addEventListener('mouseover', (e) => {
    if(e.target.tagName === 'A' || e.target.tagName === 'BUTTON' || e.target.closest('a') || e.target.closest('button')) {
      cursorOutline.style.width = '60px'; cursorOutline.style.height = '60px';
      cursorOutline.style.background = 'rgba(212, 175, 55, 0.1)'; cursorOutline.style.borderColor = 'rgba(212, 175, 55, 0.8)';
    }
  });
  document.addEventListener('mouseout', (e) => {
    if(e.target.tagName === 'A' || e.target.tagName === 'BUTTON' || e.target.closest('a') || e.target.closest('button')) {
      cursorOutline.style.width = '40px'; cursorOutline.style.height = '40px';
      cursorOutline.style.background = 'transparent'; cursorOutline.style.borderColor = 'rgba(212, 175, 55, 0.5)';
    }
  });

  // Lenis
  const lenis = new Lenis({ autoRaf: true });

  // Title Animation
  gsap.from('.reveal-text', { y: 50, opacity: 0, duration: 1, ease: 'power4.out', delay: 0.2 });

  // Fetch & Filter Logic
  let allProducts = [];

  function createAgencyCard(product) {
    const bgImage = product.thumbnail ? product.thumbnail : '';
    const badgeHtml = product.badge ? `<div class="badge">${product.badge}</div>` : '';
    return `
      <a href="product.html?item=${encodeURIComponent(product.title)}" class="product-card item-card" data-category="${product.category}">
        <div class="card-image-wrap">
          <img src="${bgImage}" class="card-image" alt="${product.title}" onerror="this.style.display='none'">
          ${badgeHtml}
        </div>
        <div class="card-meta">
          <span class="card-category">${product.category || 'Asset'}</span>
          <span class="card-price">Rs. ${product.price}</span>
        </div>
        <h3 class="card-title">${product.title}</h3>
      </a>
    `;
  }

  function renderCatalog(products) {
    const container = document.getElementById('full-catalog');
    if (products.length === 0) {
      container.innerHTML = `<p style="color: var(--muted); font-size: 1.2rem; font-weight: 300;">No assets found in this category.</p>`;
      return;
    }
    container.innerHTML = products.map(p => createAgencyCard(p)).join('');
    gsap.from('.item-card', { y: 40, opacity: 0, duration: 0.8, stagger: 0.05, ease: 'power3.out' });
  }

  fetch('/inventory.json')
    .then(response => response.json())
    .then(data => {
      allProducts = data.items || [];
      renderCatalog(allProducts);
    });

  // Filter Buttons
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      e.target.classList.add('active');
      const filter = e.target.getAttribute('data-filter');
      if (filter === 'all') {
        renderCatalog(allProducts);
      } else {
        const filtered = allProducts.filter(p => p.category === filter);
        renderCatalog(filtered);
      }
    });
  });
</script>
</body>
</html>
