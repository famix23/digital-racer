<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Racer | Catalog</title>
    <style>
        body { margin: 0; font-family: sans-serif; background-color: #121212; color: #ffffff; }
        header { padding: 20px; border-bottom: 1px solid #2a2a2a; }
        .logo { font-size: 20px; font-weight: 900; letter-spacing: 3px; text-decoration: none; color: white; text-transform: uppercase; }
        .logo span { color: #ffcc00; }
        .nav { margin: 20px; display: flex; gap: 20px; }
        .nav a { color: #888; text-decoration: none; text-transform: uppercase; font-size: 13px; letter-spacing: 2px; font-weight: bold; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; padding: 20px; }
        .card { background: #1e1e1e; border: 1px solid #2a2a2a; text-decoration: none; color: white; display: block; overflow: hidden; }
        .card img { width: 100%; height: 160px; object-fit: cover; }
        .card-info { padding: 15px; }
        .card-title { font-size: 14px; margin: 0 0 10px 0; text-transform: uppercase; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .card-price { color: #ffcc00; font-size: 18px; font-weight: bold; margin: 0; }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="logo">DIGITAL<span>.</span>RACER</a>
    </header>
    <div class="nav">
        <a href="catalog.html">CATALOG</a>
        <a href="index.html">HOME</a>
    </div>

    <div class="grid" id="catalog"></div>

    <script>
        async function loadCatalog() {
            try {
                const res = await fetch('inventory.json');
                const products = await res.json();
                const container = document.getElementById('catalog');
                
                products.forEach((p, i) => {
                    container.innerHTML += `
                        <a href="product.html?id=${i}" class="card">
                            <img src="${p.image}" alt="Product">
                            <div class="card-info">
                                <h3 class="card-title">${p.title}</h3>
                                <p class="card-price">$${p.price}</p>
                            </div>
                        </a>
                    `;
                });
            } catch (e) {
                console.error("Error loading catalog:", e);
            }
        }
        loadCatalog();
    </script>
</body>
</html>
