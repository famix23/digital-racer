<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digital Racer — Full Catalog</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;900&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #050505;
  --surface: #111111;
  --surface2: #181818;
  --border: #222222;
  --text: #ffffff;
  --muted: #888888;
  --accent: #d4af37;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: 'Open Sans', sans-serif; overflow-x: hidden; }
h1, h2, h3 { font-family: 'Montserrat', sans-serif; }

/* Top Navigation */
nav { display: flex; justify-content: space-between; align-items: center; padding: 20px 5vw; border-bottom: 1px solid var(--border); background: var(--bg); position: sticky; top: 0; z-index: 100; }
.logo { font-size: 1.1rem; font-weight: 900; letter-spacing: 3px; text-transform: uppercase; color: var(--text); text-decoration: none; }
.logo span { color: var(--accent); }
.nav-link { color: var(--muted); text-decoration: none; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; font-weight: 600; transition: color 0.2s; }
.nav-link:hover { color: var(--accent); }

/* Header & Filters */
.catalog-header { padding: 60px 5vw 30px; max-width: 1300px; margin: 0 auto; }
.page-title { font-size: clamp(2rem, 4vw, 3rem); font-weight: 900; text-transform: uppercase; letter-spacing: -1px; margin-bottom: 30px; }
.page-title span { color: var(--accent); }

.filters { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 40px; }
.filter-btn { background: var(--surface); border: 1px solid var(--border); color: var(--muted); padding: 10px 20px; font-family: 'Montserrat', sans-serif; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; font-size: 0.75rem; border-radius: 4px; cursor: pointer; transition: all 0.2s; }
.filter-btn.active, .filter-btn:hover { border-color: var(--accent); color: var(--accent); background: rgba(212, 175, 55, 0.05); }

/* Grid */
.container { max-width: 1300px; margin: 0 auto; padding: 0 5vw 80px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 30px; }
.product-card { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; overflow: hidden; text-decoration: none; color: var(--text); display: flex; flex-direction: column; transition: border-color 0.3s; opacity: 0; transform: translateY(20px); }
.product-card:hover { border-color: var(--accent); }
.prod-img-wrap { width: 100%; aspect-ratio: 4/3; background: var(--surface2); position: relative; overflow: hidden; }
.prod-img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s ease; }
.product-card:hover .prod-img { transform: scale(1.05); }
.prod-badge { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.8); border: 1px solid var(--accent); color: var(--accent); padding: 4px 10px; font-size: 0.65rem; text-transform: uppercase; font-weight: 700; letter-spacing: 1px; }

.prod-content { padding: 20px; display: flex; flex-direction: column; flex-grow: 1; }
.prod-category { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 2px; color: var(--accent); font-weight: 700; margin-bottom: 8px; }
.prod-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 16px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.prod-footer { margin-top: auto; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border); padding-top: 16px; }
.prod-price { font-size: 1.25rem; font-weight: 800; color: var(--accent); font-family: 'Montserrat', sans-serif; }
.prod-btn { background: var(--surface2); color: var(--text); padding: 8px 16px; border-radius: 4px; font-size: 0.8rem; font-weight: 700; text-transform: uppercase; border: 1px solid var(--border); transition: all 0.2s; }
.product-card:hover .prod-btn { background: var(--accent); color: #000; border-color: var(--accent); }

/* Footer */
footer { background: var(--surface); border-top: 1px solid var(--border); padding: 40px 5vw; text-align: center; color: var(--muted); font-size: 0.9rem; }

@media(max-width: 768px) {
  .grid { grid-template-columns: repeat(2, 1fr); gap: 15px; }
  .catalog-header { padding: 40px 4vw 20px; }
  .container { padding: 0 4vw 60px; }
  .prod-content { padding: 12px; }
  .prod-title { font-size: 0.95rem; }
  .prod-price { font-size: 1.05rem; }
}
</style>
</head>
<body>

<nav>
  <a href="index.html" class="logo">Digital<span>.</span>Racer</a>
  <a href="index.html" class="nav-link">← Home</a>
</nav>

<div class="catalog-header">
  <h1 class="page-title">Full <span>Archive</span></h1>
  <div class="filters">
    <button class="filter-btn active" data-filter="all">All Assets</button>
    <button class="filter-btn" data-filter="Account">Accounts</button>
    <button class="filter-btn" data-filter="UC Top-Up">UC Top-Ups</button>
    <button class="filter-btn" data-filter="Car Card">Car Skins</button>
  </div>
</div>

<div class="container">
  <div class="grid" id="full-catalog">
    <p style="color: var(--muted);">Loading inventory...</p>
  </div>
</div>

<footer>
  <p>© 2026 Digital Racer. All rights reserved.</p>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

<script>
  let allProducts = [];

  function createCardHTML(product) {
    const bgImage = product.thumbnail ? product.thumbnail : '';
    const badgeHtml = product.badge ? `<div class="prod-badge">${product.badge}</div>` : '';
    
    return `
      <a href="product.html?item=${encodeURIComponent(product.title)}" class="product-card item-card" data-category="${product.category}">
        <div class="prod-img-wrap">
          <img src="${bgImage}" class="prod-img" alt="${product.title}" onerror="this.style.display='none'">
          ${badgeHtml}
        </div>
        <div class="prod-content">
          <div class="prod-category">${product.category || 'Asset'}</div>
          <div class="prod-title">${product.title}</div>
          <div class="prod-footer">
            <div class="prod-price">Rs. ${product.price}</div>
            <div class="prod-btn">View</div>
          </div>
        </div>
      </a>
    `;
  }

  function renderCatalog(products) {
    const container = document.getElementById('full-catalog');
    if (products.length === 0) {
      container.innerHTML = `<p style="color: var(--muted);">No assets found in this category.</p>`;
      return;
    }
    container.innerHTML = products.map(p => createCardHTML(p)).join('');
    
    // Animate cards smoothly into view
    gsap.to('.item-card', {
      opacity: 1,
      y: 0,
      duration: 0.6,
      stagger: 0.05,
      ease: 'power3.out'
    });
  }

  fetch('/inventory.json')
    .then(response => response.json())
    .then(data => {
      allProducts = data.items || [];
      renderCatalog(allProducts);
    })
    .catch(error => console.error("Error loading inventory:", error));

  // Filter Buttons Logic
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      e.target.classList.add('active');
      const filter = e.target.getAttribute('data-filter');
      
      if (filter === 'all') {
        renderCatalog(allProducts);
      } else {
        const filtered = allProducts.filter(p => p.category === filter);
        renderCatalog(filtered);
      }
    });
  });
</script>

</body>
</html>
