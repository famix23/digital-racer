backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "store_inventory"
    label: "Store Inventory"
    files:
      - label: "Product Catalog"
        name: "catalog"
        file: "inventory.json"
        fields:
          - label: "Products"
            name: "items"
            widget: "list"
            fields:
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Price (PKR)", name: "price", widget: "string"}
              - {label: "Category", name: "category", widget: "select", options: ["Account", "UC Top-Up", "Car Card"]}
              - {label: "Highlight Tag (e.g., Global, Level 78)", name: "tag", widget: "string", default: "Global"}
              - {label: "Image Badge (e.g., 📷 8 Screens, ⚡ Instant)", name: "badge", widget: "string", default: "⚡ Instant"}
              - {label: "Main Thumbnail Image", name: "thumbnail", widget: "image", required: false}
              - {label: "Product Description", name: "body", widget: "markdown", required: false}
