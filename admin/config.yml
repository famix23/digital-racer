backend:
  name: github
  repo: famix23/digital-racer
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "inventory"
    label: "Store Inventory"
    files:
      - file: "inventory.json"
        label: "Catalog"
        name: "catalog"
        fields:
          - name: "items"
            label: "Products"
            widget: "list"
            fields:
              - label: "Title (Exact Reseller Wording)"
                name: "title"
                widget: "string"
                hint: "For a new listing, paste the reseller title exactly. Do not prepend PUBG Mobile Account or other SEO keywords."

              - label: "Supplier Title Proof (New Reseller Imports)"
                name: "source_title"
                widget: "string"
                required: false
                hint: "For EVERY new reseller-sourced product, paste the exact title from the supplier page here too. It must match Title character-for-character, including PUBG Mobile Account if the seller used it. CI rejects missing or rewritten titles."

              - label: "Listing Origin (New Products)"
                name: "listing_origin"
                widget: "select"
                required: false
                options: ["reseller", "original"]
                hint: "Reseller is assumed when omitted. Select original ONLY for your own products, not products copied from another seller."

              - label: "Original Reseller Title (Optional, for Existing Listings)"
                name: "original_title"
                widget: "string"
                required: false
                hint: "Use the verified original seller title to correct an existing product without changing its URL or inventory identity. Keep punctuation and emojis exactly; leave blank if Title is already correct."

              - label: "Price (USD)"
                name: "price"
                widget: "string"
              
              - label: "Category"
                name: "category"
                widget: "select"
                options: ["Account", "UC Top-Up", "Car Card", "Popularity", "In-Game Items", "Rank Boosting"]
              
              - label: "Tag (e.g., GLOBAL)"
                name: "tag"
                widget: "string"
                default: "GLOBAL"
              
              - label: "Badge (e.g., Instant)"
                name: "badge"
                widget: "string"
                default: "INSTANT"
                
              - label: "Account Level (Optional)"
                name: "account_level"
                widget: "string"
                required: false
                
              - label: "Highest Tier (Optional)"
                name: "highest_tier"
                widget: "string"
                required: false
              
              - label: "Thumbnail Image"
                name: "thumbnail"
                widget: "image"
                required: false

              - label: "Reference listing (disables ordering)"
                name: "reference_only"
                widget: "boolean"
                required: false
                default: false
              
              - label: "Additional Gallery Images"
                name: "gallery"
                widget: "list"
                required: false
                field:
                  label: "Image"
                  name: "image"
                  widget: "image"
              
              - label: "Description (Use dashes '-' for bullet points)"
                name: "description"
                widget: "text"
