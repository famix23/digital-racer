backend:
  name: github
  repo: famix23/digital-racer-store
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "store"
    label: "Store Inventory"
    files:
      - label: "Inventory List"
        name: "inventory"
        file: "inventory.json"
        fields:
          - label: "Products"
            name: "items"
            widget: "list"
            fields:
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Price (PKR)", name: "price", widget: "string"}
              - {label: "Category", name: "category", widget: "select", options: ["Account", "UC Top-Up", "Car Card"]}
              - {label: "Tag (e.g., GLOBAL)", name: "tag", widget: "string", default: "GLOBAL"}
              - {label: "Badge (e.g., Instant)", name: "badge", widget: "string", required: false}
              - {label: "Thumbnail Image", name: "thumbnail", widget: "image", required: false}
