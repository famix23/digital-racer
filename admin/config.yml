backend:
  name: github
  repo: famix23/digital-racer
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "inventory"
    label: "Store Inventory"
    files:
      - file: "inventory.json"
        label: "Catalog"
        name: "catalog"
        fields:
          - name: "items"
            label: "Products"
            widget: "list"
            fields:
              - label: "Title"
                name: "title"
                widget: "string"
              
              - label: "Price (PKR)"
                name: "price"
                widget: "string"
              
              - label: "Category"
                name: "category"
                widget: "select"
                options: ["Account", "UC Top-Up", "Car Card"]
              
              - label: "Tag (e.g., GLOBAL)"
                name: "tag"
                widget: "string"
                default: "GLOBAL"
              
              - label: "Badge (e.g., Instant)"
                name: "badge"
                widget: "string"
                default: "INSTANT"
              
              - label: "Thumbnail Image"
                name: "thumbnail"
                widget: "image"
              
              - label: "Additional Gallery Images"
                name: "gallery"
                widget: "list"
                required: false
                field:
                  label: "Image"
                  name: "image"
                  widget: "image"
              
              - label: "Description"
                name: "description"
                widget: "text"
