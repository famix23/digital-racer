<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Digital Racer — Asset Details</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;800;900&family=Open+Sans:wght@300;400;600&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #050505;
  --surface: #111111;
  --border: #2a2a2a;
  --text: #ffffff;
  --muted: #9ba4b5;
  --accent: #d4af37;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: 'Open Sans', sans-serif; overflow-x: hidden; -webkit-font-smoothing: antialiased; }
h1, h2, h3 { font-family: 'Montserrat', sans-serif; }

/* Navigation */
nav { padding: 30px 5vw; position: absolute; width: 100%; z-index: 10; mix-blend-mode: difference;}
.logo { font-size: 1.1rem; font-weight: 800; letter-spacing: 4px; text-transform: uppercase; color: var(--text); text-decoration: none; }
.logo span { color: var(--accent); }

/* Product Layout */
.product-wrapper { display: flex; height: 100vh; overflow: hidden; }

/* Left Side: Image */
.image-pane { width: 50%; height: 100%; position: relative; background: var(--surface); }
.image-pane img { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; filter: grayscale(40%) contrast(1.1); transition: filter 0.5s;}
.image-pane:hover img { filter: grayscale(0%) contrast(1); }

/* Right Side: Details */
.details-pane { width: 50%; height: 100%; padding: 100px 5vw 60px; overflow-y: auto; display: flex; flex-direction: column; }
.back-link { display: inline-block; margin-bottom: 30px; color: var(--muted); text-decoration: none; text-transform: uppercase; letter-spacing: 2px; font-size: 0.8rem; border-bottom: 1px solid var(--border); padding-bottom: 4px; transition: color 0.3s; align-self: flex-start;}
.back-link:hover { color: var(--accent); border-color: var(--accent); }

.p-category { color: var(--accent); text-transform: uppercase; letter-spacing: 3px; font-weight: 600; font-size: 0.85rem; margin-bottom: 12px; }
.p-title { font-size: clamp(2rem, 4vw, 3.5rem); font-weight: 900; line-height: 1.1; margin-bottom: 16px; text-transform: uppercase; letter-spacing: -1px; }
.p-price { font-size: 2rem; color: var(--muted); font-weight: 300; margin-bottom: 30px; }

/* Restored Description Block */
.description-block { margin-bottom: 40px; }
.description-label { font-family: 'Montserrat', sans-serif; font-size: 1.2rem; font-weight: 700; color: var(--text); margin-bottom: 12px; display: flex; align-items: center; gap: 8px;}
.description-label::before { content: ""; display: block; width: 4px; height: 20px; background: var(--accent); }
.p-desc { font-size: 1rem; color: var(--muted); line-height: 1.7; }

.p-meta { margin-bottom: 40px; padding-top: 30px; border-top: 1px solid var(--border); display: grid; grid-template-columns: 1fr 1fr; gap: 20px;}
.meta-block { display: flex; flex-direction: column; }
.meta-label { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 8px;}
.meta-value { font-size: 1.1rem; font-weight: 600; font-family: 'Montserrat', sans-serif;}

/* WhatsApp CTA */
.cta-button {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  background: #25D366; color: #ffffff; padding: 18px 32px;
  font-family: 'Montserrat', sans-serif; font-weight: 800; text-transform: uppercase;
  letter-spacing: 1px; text-decoration: none; font-size: 1rem; border-radius: 4px;
  transition: all 0.3s ease; box-shadow: 0 4px 15px rgba(37, 211, 102, 0.2);
  margin-top: auto;
}
.cta-button:hover { background: #1ebe5d; transform: translateY(-3px); box-shadow: 0 8px 25px rgba(37, 211, 102, 0.4); }

/* Mobile Adjustments */
@media(max-width: 900px) {
  .product-wrapper { flex-direction: column; height: auto; overflow: visible; }
  .image-pane { width: 100%; height: 50vh; }
  .details-pane { width: 100%; height: auto; overflow: visible; padding: 40px 5vw 80px; }
  nav { mix-blend-mode: normal; background: linear-gradient(180deg, rgba(0,0,0,0.8), transparent); }
}
</style>
</head>
<body>

<nav>
  <a href="index.html" class="logo">Digital<span>.</span>Racer</a>
</nav>

<div class="product-wrapper">
  <div class="image-pane" id="prod-img-container">
    <!-- Image injected by JS -->
  </div>
  
  <div class="details-pane">
    <a href="catalog.html" class="back-link">← Return to Archive</a>
    
    <div class="p-category" id="prod-category">Loading...</div>
    <h1 class="p-title" id="prod-title">Asset Loading</h1>
    <div class="p-price" id="prod-price">...</div>
    
    <div class="description-block">
      <h3 class="description-label">Product Description</h3>
      <div class="p-desc" id="prod-desc">Loading detailed inventory stats...</div>
    </div>
    
    <div class="p-meta">
      <div class="meta-block">
        <span class="meta-label">Region Tag</span>
        <span class="meta-value" id="prod-tag">-</span>
      </div>
      <div class="meta-block">
        <span class="meta-label">Status</span>
        <span class="meta-value" style="color: var(--accent);" id="prod-badge">Available</span>
      </div>
    </div>
    
    <a href="#" class="cta-button" id="buy-btn">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.888-.788-1.487-1.761-1.66-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51a12.8 12.8 0 0 0-.57-.01c-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413Z"/></svg>
      Chat to Buy
    </a>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

<script>
  // Get item name from URL
  const urlParams = new URLSearchParams(window.location.search);
  const itemName = urlParams.get('item');

  if (!itemName) {
    document.getElementById('prod-title').innerText = "Asset Not Found";
  } else {
    fetch('/inventory.json')
      .then(response => response.json())
      .then(data => {
        const products = data.items || [];
        const product = products.find(p => p.title === itemName);

        if (product) {
          document.getElementById('prod-title').innerText = product.title;
          document.getElementById('prod-category').innerText = product.category || 'Asset';
          document.getElementById('prod-price').innerText = `Rs. ${product.price}`;
          document.getElementById('prod-tag').innerText = product.tag || 'GLOBAL';
          document.getElementById('prod-badge').innerText = product.badge || 'Instant Delivery';
          
          // Render description, or use a default if it doesn't exist in the JSON
          const defaultDesc = "Premium digital asset with full access. Inventory details are available in the listing image. Contact for more information or serious offers only.";
          document.getElementById('prod-desc').innerText = product.description || defaultDesc;

          if (product.thumbnail) {
            document.getElementById('prod-img-container').innerHTML = `<img src="${product.thumbnail}" alt="${product.title}">`;
          } else {
            document.getElementById('prod-img-container').innerHTML = `<div style="width:100%; height:100%; display:flex; align-items:center; justify-content:center; color: var(--border); font-size: 5rem;">DR.</div>`;
          }

          // WhatsApp Link Logic
          const waNumber = "923000000000"; // CHANGE TO YOUR NUMBER
          const message = `Hello Digital Racer! I want to acquire: ${product.title} for Rs. ${product.price}.`;
          document.getElementById('buy-btn').href = `https://wa.me/${waNumber}?text=${encodeURIComponent(message)}`;

          // Simple fade in
          gsap.from('.image-pane', { opacity: 0, duration: 1.5, ease: 'power3.out' });
          gsap.from('.details-pane > *', { y: 20, opacity: 0, duration: 0.8, stagger: 0.05, ease: 'power3.out', delay: 0.2 });
        } else {
          document.getElementById('prod-title').innerText = "Asset Not Found";
        }
      });
  }
</script>
</body>
</html>
