<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Dynamic SEO Meta Tags Default -->
<title>Digital Racer — Asset Details</title>
<meta name="description" id="meta-desc" content="Browse verified PUBG accounts, car skins, and UC top-ups at Digital Racer.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;900&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #050505;
  --surface: #111111;
  --surface2: #181818;
  --border: #222222;
  --text: #ffffff;
  --muted: #888888;
  --accent: #d4af37;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: 'Open Sans', sans-serif; overflow-x: hidden; }
h1, h2, h3 { font-family: 'Montserrat', sans-serif; }

nav { display: flex; justify-content: space-between; align-items: center; padding: 16px 5vw; border-bottom: 1px solid var(--border); background: var(--bg); position: sticky; top: 0; z-index: 100; }
.logo { font-size: 1.1rem; font-weight: 900; letter-spacing: 3px; text-transform: uppercase; color: var(--text); text-decoration: none; }
.logo span { color: var(--accent); }
.nav-link { color: var(--muted); text-decoration: none; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; font-weight: 600; transition: color 0.2s; }
.nav-link:hover { color: var(--accent); }

.product-container { max-width: 1200px; margin: 50px auto; padding: 0 5vw; display: grid; grid-template-columns: 1.2fr 1fr; gap: 50px; align-items: start; }

.image-box { width: 100%; aspect-ratio: 4/3; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; overflow: hidden; position: relative; }
.image-box img { width: 100%; height: 100%; object-fit: cover; }

.details-box { display: flex; flex-direction: column; }
.p-category { color: var(--accent); text-transform: uppercase; letter-spacing: 3px; font-weight: 700; font-size: 0.75rem; margin-bottom: 10px; }
.p-title { font-size: clamp(1.8rem, 3vw, 2.6rem); font-weight: 900; line-height: 1.1; margin-bottom: 16px; text-transform: uppercase; letter-spacing: -1px; }
.p-price { font-size: 2rem; color: var(--accent); font-weight: 800; font-family: 'Montserrat', sans-serif; margin-bottom: 24px; }

.desc-section { margin-bottom: 30px; border-top: 1px solid var(--border); padding-top: 20px; }
.desc-title { font-size: 0.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 8px; color: var(--text); }
.p-desc { font-size: 0.95rem; color: var(--muted); line-height: 1.6; }

.meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; padding-top: 20px; border-top: 1px solid var(--border); }
.meta-item span:first-child { display: block; font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 6px; }
.meta-item span:last-child { font-size: 1.05rem; font-weight: 600; font-family: 'Montserrat', sans-serif; color: var(--text); }

.whatsapp-btn {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  background: var(--accent); color: #000; padding: 16px 28px;
  font-family: 'Montserrat', sans-serif; font-weight: 800; text-transform: uppercase;
  letter-spacing: 1px; text-decoration: none; font-size: 0.95rem; border-radius: 4px;
  transition: all 0.2s ease; box-shadow: 0 4px 15px rgba(212, 175, 55, 0.2);
}
.whatsapp-btn:hover { background: #fff; transform: translateY(-2px); }

footer { background: var(--surface); border-top: 1px solid var(--border); padding: 30px 5vw; text-align: center; color: var(--muted); font-size: 0.85rem; margin-top: 80px; }

@media(max-width: 900px) {
  .product-container { grid-template-columns: 1fr; gap: 30px; margin: 20px auto; }
}
</style>
</head>
<body>

<nav>
  <a href="index.html" class="logo">Digital<span>.</span>Racer</a>
  <a href="catalog.html" class="nav-link">← Catalog</a>
</nav>

<div class="product-container">
  <div class="image-box" id="prod-img-container">
    <!-- Image injected -->
  </div>
  
  <div class="details-box">
    <div class="p-category" id="prod-category">Loading...</div>
    <h1 class="p-title" id="prod-title">Asset Loading</h1>
    <div class="p-price" id="prod-price">...</div>
    
    <div class="desc-section">
      <div class="desc-title">Product Description</div>
      <div class="p-desc" id="prod-desc">Loading details...</div>
    </div>
    
    <div class="meta-grid">
      <div class="meta-item">
        <span>Region Tag</span>
        <span id="prod-tag">-</span>
      </div>
      <div class="meta-item">
        <span>Status</span>
        <span style="color: var(--accent);" id="prod-badge">Instant</span>
      </div>
    </div>
    
    <a href="#" class="whatsapp-btn" id="buy-btn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.888-.788-1.487-1.761-1.66-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51a12.8 12.8 0 0 0-.57-.01c-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413Z"/></svg>
      Acquire via WhatsApp
    </a>
  </div>
</div>

<footer>
  <p>© 2026 Digital Racer. All rights reserved.</p>
</footer>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  const itemName = urlParams.get('item');

  if (!itemName) {
    document.getElementById('prod-title').innerText = "Asset Not Found";
  } else {
    fetch('/inventory.json')
      .then(response => response.json())
      .then(data => {
        const products = data.items || [];
        const product = products.find(p => p.title === itemName);

        if (product) {
          // Dynamic SEO Optimization Updates
          document.title = `${product.title} — Digital Racer`;
          
          const metaDesc = document.getElementById('meta-desc');
          const descriptionText = product.description || `Acquire ${product.title} securely at Digital Racer. Instant global delivery.`;
          if (metaDesc) metaDesc.setAttribute('content', descriptionText);

          document.getElementById('prod-title').innerText = product.title;
          document.getElementById('prod-category').innerText = product.category || 'Asset';
          document.getElementById('prod-price').innerText = `Rs. ${product.price}`;
          document.getElementById('prod-tag').innerText = product.tag || 'GLOBAL';
          document.getElementById('prod-badge').innerText = product.badge || 'Instant';
          document.getElementById('prod-desc').innerText = descriptionText;

          if (product.thumbnail) {
            document.getElementById('prod-img-container').innerHTML = `<img src="${product.thumbnail}" alt="${product.title}">`;
          } else {
            document.getElementById('prod-img-container').innerHTML = `<div style="width:100%; height:100%; display:flex; align-items:center; justify-content:center; color: var(--border);">No Image</div>`;
          }

          const waNumber = "923000000000"; // CHANGE TO YOUR ACTUAL WHATSAPP NUMBER
          const message = `Hello Digital Racer! I want to acquire: ${product.title} for Rs. ${product.price}.`;
          document.getElementById('buy-btn').href = `https://wa.me/${waNumber}?text=${encodeURIComponent(message)}`;
        } else {
          document.getElementById('prod-title').innerText = "Asset Not Found";
        }
      })
      .catch(error => console.error("Error loading inventory:", error));
  }
</script>
</body>
</html>
