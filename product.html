<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Racer | Product</title>
    <style>
        body { margin: 0; font-family: sans-serif; background-color: #121212; color: #ffffff; }
        header { padding: 20px; border-bottom: 1px solid #2a2a2a; }
        .logo { font-size: 20px; font-weight: 900; letter-spacing: 3px; text-decoration: none; color: white; text-transform: uppercase; }
        .logo span { color: #ffcc00; }
        
        .search-bar { display: flex; margin: 20px; background: #1e1e1e; border-radius: 4px; overflow: hidden; border: 1px solid #2a2a2a; }
        .search-bar input { flex: 1; background: transparent; border: none; padding: 15px; color: white; outline: none; }
        .search-bar button { background: transparent; border: none; color: #ffcc00; font-weight: bold; padding: 0 20px; cursor: pointer; text-transform: uppercase; }
        
        .nav { margin: 0 20px 20px 20px; display: flex; gap: 20px; }
        .nav a { color: #888; text-decoration: none; text-transform: uppercase; font-size: 13px; letter-spacing: 2px; font-weight: bold; }
        
        .product-container { padding: 20px; }
        .breadcrumb { color: #555; font-size: 12px; text-transform: uppercase; margin-bottom: 20px; letter-spacing: 2px; font-weight: bold; }
        
        .badges { display: flex; flex-direction: column; gap: 12px; margin-bottom: 25px; align-items: flex-start; }
        .badge { border: 1px solid #ffcc00; color: #ffcc00; padding: 10px 15px; font-size: 12px; font-weight: bold; letter-spacing: 1px; text-transform: uppercase; display: inline-block; }
        
        /* FIXED MOBILE FONT: Scaled down to 18px so titles fit on screen neatly */
        .product-title { font-size: 18px; font-weight: bold; text-transform: uppercase; margin: 0 0 15px 0; line-height: 1.4; word-wrap: break-word; }
        
        .product-price { font-size: 24px; font-weight: bold; color: #ffcc00; margin-bottom: 25px; }
        
        .product-image { width: 100%; height: auto; max-height: 400px; object-fit: cover; margin-bottom: 20px; background: #1e1e1e; border: 1px solid #2a2a2a; }
        
        .description-card { background: #1e1e1e; padding: 20px; border: 1px solid #2a2a2a; margin-bottom: 30px; line-height: 1.6; white-space: pre-wrap; font-size: 15px; }
        
        .btn-buy { display: block; width: 100%; padding: 20px; text-align: center; background-color: #ffffff; color: #000000; font-weight: bold; font-size: 16px; text-transform: uppercase; text-decoration: none; border: none; cursor: pointer; box-sizing: border-box; margin-bottom: 40px; }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="logo">DIGITAL<span>.</span>RACER</a>
    </header>
    
    <div class="search-bar">
        <input type="text" placeholder="Search products, skins, UC...">
        <button>SEARCH</button>
    </div>
    
    <div class="nav">
        <a href="catalog.html">CATALOG</a>
        <a href="index.html">HOME</a>
    </div>
    
    <div id="product-content">
        <!-- Content injected via JavaScript -->
    </div>

    <script>
        async function loadProduct() {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');
            
            try {
                const res = await fetch('inventory.json');
                const data = await res.json();
                
                // DATABASE FIX: Detect Sveltia CMS "catalog" wrapper
                let productArray = [];
                if (Array.isArray(data)) {
                    productArray = data;
                } else if (data.catalog) {
                    productArray = data.catalog;
                }

                const product = productArray[id];

                if (!product) {
                    document.getElementById('product-content').innerHTML = "<p style='padding:20px; color: #ff0000;'>Product not found. Ensure item exists in CMS.</p>";
                    return;
                }

                // Make sure to add your real WhatsApp number here!
                const businessNumber = "920000000000"; 
                const msg = `Hello Digital Racer! I want to buy:\n\n*${product.title}*\n*Price:* $${product.price}`;
                const waUrl = `https://wa.me/${businessNumber}?text=${encodeURIComponent(msg)}`;

                document.getElementById('product-content').innerHTML = `
                    <div class="product-container">
                        <div class="breadcrumb">HOME / ACCOUNT</div>
                        
                        <div class="badges">
                            <div class="badge">◆ INSTANT DELIVERY</div>
                            <div class="badge">✔ VERIFIED ACCOUNT</div>
                        </div>
                        
                        <h1 class="product-title">${product.title}</h1>
                        <p class="product-price">$${product.price}</p>
                        
                        <img src="${product.image}" class="product-image" alt="Product Image">
                        
                        <div class="description-card">
                            ${product.description}
                        </div>
                        
                        <a href="${waUrl}" class="btn-buy" target="_blank">BUY NOW VIA WHATSAPP</a>
                    </div>
                `;
            } catch (e) {
                console.error("Error loading product:", e);
                document.getElementById('product-content').innerHTML = "<p style='padding:20px; color: #ff0000;'>Database connection error.</p>";
            }
        }
        
        loadProduct();
    </script>
</body>
</html>
