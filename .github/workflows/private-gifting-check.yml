name: Private gifting checks
on:
  pull_request:
    paths:
      - 'src/gifting*.mjs'
      - 'src/worker.mjs'
      - 'wrangler.jsonc'
      - 'scripts/test_private_gifting.mjs'
      - '.github/workflows/private-gifting-check.yml'
  push:
    branches: [main]
    paths:
      - 'src/gifting*.mjs'
      - 'src/worker.mjs'
      - 'wrangler.jsonc'
      - 'scripts/test_private_gifting.mjs'
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test_private_gifting.mjs
