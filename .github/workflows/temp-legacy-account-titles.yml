name: Temporary legacy-account title page rebuild
on:
  push:
    branches: [fix/cms-reseller-titles-20261116]
    paths:
      - content/product-title-overrides.json
      - scripts/test_product_titles.py
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild pages and verify source priority
        run: |
          python3 scripts/build_seo.py
          python3 scripts/test_product_titles.py
          python3 scripts/build_seo.py --check
      - name: Commit generated catalog and canonical pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate 201 corrected legacy account title displays"
            git push
          fi
