name: Temporary SEO snippets regeneration
on:
  push:
    branches: [seo/product-snippets-and-indexing-watch-20261118]
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate product metadata
        run: python3 scripts/build_seo.py
      - name: Prove every visible product page is unchanged
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, re, subprocess
          files = subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines()
          assert files, "Expected product snippets to change"
          assert all(re.fullmatch(r"p/[^/]+/index\.html", p) for p in files), f"Non-product/UI file changed: {files[:20]}"
          def normalized(s):
              for marker in (
                  '<meta name="description" content="[^"]*">',
                  '<meta property="og:description" content="[^"]*">',
                  '<meta name="twitter:description" content="[^"]*">',
              ):
                  s = re.sub(marker, "__SEO_DESCRIPTION__", s)
              return s
          for p in files:
              old = subprocess.check_output(["git", "show", "HEAD:" + p], text=True)
              new = pathlib.Path(p).read_text(encoding="utf-8")
              assert old.split("</head>", 1)[1] == new.split("</head>", 1)[1], f"UI changed: {p}"
              assert normalized(old) == normalized(new), f"Unexpected non-description changes: {p}"
          print("SEO_ONLY_DESCRIPTION_VALIDATION", len(files), "product pages; HTML body and other metadata unchanged")
          PY
      - name: Full search, title, category and mobile regression tests
        run: |
          python3 scripts/test_indexing.py
          python3 scripts/test_product_titles.py
          python3 scripts/audit_product_seo.py
          python3 scripts/report_priority_product_seo.py
          python3 scripts/test_shop_hubs.py
          python3 scripts/build_seo.py --check
          node scripts/test_storefront.cjs
          node scripts/test_category_navigation.cjs
          node scripts/test_mobile_experience.cjs
      - name: Commit generated descriptions and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/seo-descriptions-rebuild-20261118.yml
          git add -u p .github/workflows/seo-descriptions-rebuild-20261118.yml
          git commit -m "Regenerate factual SEO snippets without visual or pricing changes"
          git push origin HEAD:seo/product-snippets-and-indexing-watch-20261118
