# One-time branch-only rebuild; remove before merge.
name: Rebuild distinct product SEO summaries (one time)
on:
  push:
    branches:
      - seo/deduplicate-product-meta-descriptions-20261111
permissions:
  contents: write
jobs:
  build:
    if: github.repository == 'famix23/digital-racer' && github.ref == 'refs/heads/seo/deduplicate-product-meta-descriptions-20261111'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate and validate metadata for every product
        run: |
          python3 scripts/build_seo.py
          python3 scripts/test_indexing.py
          python3 scripts/audit_product_seo.py
          python3 scripts/build_seo.py --check
      - name: Confirm only pre-rendered product pages changed
        run: |
          git diff --name-only | grep -v '^p/.*index\.html$' | tee /tmp/unexpected.txt
          test ! -s /tmp/unexpected.txt
      - name: Commit regenerated SEO pages
        run: |
          git config user.name "DigitalRacer SEO Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u p/
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate unique product SEO summaries"
            git push origin HEAD:refs/heads/seo/deduplicate-product-meta-descriptions-20261111
          fi
