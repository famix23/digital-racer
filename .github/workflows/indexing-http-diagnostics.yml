name: Public indexing HTTP diagnostics
on:
  pull_request:
    paths:
      - 'scripts/diagnose_public_indexing.py'
      - '.github/workflows/indexing-http-diagnostics.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check external HTTP fetch from GitHub runner
        run: python3 scripts/diagnose_public_indexing.py
