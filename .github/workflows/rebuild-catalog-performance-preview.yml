name: Rebuild lean mobile catalog preview
# Re-run after completing simulated browser interaction test environment.
on:
  push:
    branches: [perf/mobile-catalog-lightweight-20261121]
    paths:
      - .github/workflows/rebuild-catalog-performance-preview.yml
permissions:
  contents: write
jobs:
  regenerate:
    if: github.ref == 'refs/heads/perf/mobile-catalog-lightweight-20261121'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build compact HTML and searchable feeds against current inventory
        run: python3 scripts/build_seo.py
      - name: Commit generated files to feature branch only
        run: |
          git config user.name "DigitalRacer Performance Builder"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate 24-card catalog, search feed and product index"
            git push origin HEAD:perf/mobile-catalog-lightweight-20261121
          fi
      - name: Run catalog performance, storefront and contrast tests
        run: |
          python3 scripts/build_seo.py --check
          node scripts/test_catalog_performance.cjs
          node scripts/test_mobile_experience.cjs
          node scripts/test_visual_polish.cjs
          node scripts/test_speed_drift_contrast.cjs
          node scripts/test_theme.cjs
          node scripts/test_storefront.cjs
          python3 scripts/test_indexing.py
