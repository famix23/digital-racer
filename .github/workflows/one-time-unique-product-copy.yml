# Temporary branch-only maintenance workflow; delete before merging.
name: One-time quality product page rebuild
on:
  push:
    branches:
      - content/unique-product-details-20261109
permissions:
  contents: write
jobs:
  rebuild:
    if: github.repository == 'famix23/digital-racer' && github.ref == 'refs/heads/content/unique-product-details-20261109'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild changed product metadata and descriptions
        run: |
          python3 scripts/build_seo.py
          python3 scripts/test_content_quality.py
          python3 scripts/test_indexing.py
          python3 scripts/build_seo.py --check
      - name: Check only generated product assets changed
        run: |
          git diff --name-only | grep -v '^p/.*index\.html$' | tee /tmp/unexpected.txt
          test ! -s /tmp/unexpected.txt
      - name: Commit regenerated static product pages
        run: |
          git config user.name "DigitalRacer SEO Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u p/
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate unique, evidence-grounded product descriptions"
            git push origin HEAD:refs/heads/content/unique-product-details-20261109
          fi
