name: Rebuild final theme preview from latest catalog
on:
  push:
    branches:
      - feature/premium-day-night-bentley-speed-drift-v2-20261121
    paths:
      - .github/workflows/rebuild-theme-v2-preview.yml
permissions:
  contents: write
jobs:
  regenerate:
    if: github.ref == 'refs/heads/feature/premium-day-night-bentley-speed-drift-v2-20261121'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate all pages against current catalog
        run: python3 scripts/build_seo.py
      - name: Save rebuilt pages only to design branch
        run: |
          git config user.name "DigitalRacer Preview Builder"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Rebuild premium day/night theme on current 982-product inventory"
            git push origin HEAD:feature/premium-day-night-bentley-speed-drift-v2-20261121
          fi
      - name: Validate theme, product and Speed Drift integrity
        run: |
          python3 scripts/build_seo.py --check
          node scripts/test_theme.cjs
          node scripts/test_dropzone_demo.cjs
          node scripts/test_speed_drift_interactions.cjs
