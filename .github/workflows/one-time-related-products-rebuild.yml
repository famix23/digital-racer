# Temporary branch-only maintenance workflow; remove before merging.
name: Rebuild pre-rendered product links (one time)
on:
  push:
    branches:
      - seo/balanced-product-discovery-links-20261109
permissions:
  contents: write
jobs:
  rebuild:
    if: github.repository == 'famix23/digital-racer' && github.ref == 'refs/heads/seo/balanced-product-discovery-links-20261109'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate crawlable product recommendation links
        run: |
          python3 scripts/build_seo.py
          python3 scripts/test_indexing.py
          python3 scripts/build_seo.py --check
      - name: Ensure only generated product pages changed
        run: |
          git diff --name-only | grep -v '^p/.*index\.html$' | tee /tmp/unexpected.txt
          test ! -s /tmp/unexpected.txt
      - name: Commit generated pages on this branch only
        run: |
          git config user.name "DigitalRacer SEO Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u p/
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate all product pages with balanced crawlable related links"
            git push origin HEAD:refs/heads/seo/balanced-product-discovery-links-20261109
          fi
