name: Staging supplier title regeneration
on:
  push:
    branches: [fix/cms-reseller-titles-20261116]
    paths:
      - inventory.json
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate and verify catalog pages
        run: |
          python3 scripts/build_seo.py
          python3 scripts/test_product_titles.py
          python3 scripts/build_seo.py --check
      - name: Save generated pages to staging branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate original supplier title across pages"
            git push
          fi
