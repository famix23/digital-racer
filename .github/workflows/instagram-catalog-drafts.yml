name: Instagram catalog drafts
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - inventory.json
      - p/index.json
      - scripts/export_instagram.py
  schedule:
    - cron: "45 3 * * *"
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate unpublished Instagram drafts
        run: python scripts/export_instagram.py --output social/instagram/generated
      - uses: actions/upload-artifact@v4
        with:
          name: digitalracer-instagram-drafts
          path: social/instagram/generated/
          retention-days: 30
