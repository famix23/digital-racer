name: Verify Speed Drift Mobile Production Assets
on:
  pull_request:
    paths:
      - ".github/workflows/verify-speed-drift-mobile-live.yml"
permissions:
  contents: read
jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify Speed Drift live deployment assets and tap-to-continue
        run: |
          python3 - <<'PY'
          import urllib.request, json, sys, time
          base="https://www.digitalracer.store/dropzone/"
          checks=[
            ("index.html","",["Tap or click any vehicle to open Player Details instantly","$120 per Card"]),
            ("app.js","app.js",["function openPlayerDetails(){","openPlayerDetails();","target.scrollIntoView"]),
            ("style.css","style.css",["Speed Drift mobile-first interaction","scroll-margin-top:86px","max-width:390px"])
          ]
          all_ok=True
          for name,path,markers in checks:
            url=base+path
            try:
              req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 (SpeedDrift production verification)","Cache-Control":"no-cache"})
              with urllib.request.urlopen(req,timeout=20) as response:
                body=response.read(500000).decode("utf-8","replace")
                missing=[x for x in markers if x not in body]
                result={"asset":name,"url":url,"status":response.status,"markers_present":not missing,"missing_markers":missing}
                all_ok=all_ok and response.status==200 and not missing
                print("RESULT",json.dumps(result),flush=True)
            except Exception as exc:
              print("RESULT",json.dumps({"asset":name,"url":url,"error":str(exc)}),flush=True)
              all_ok=False
          if not all_ok:
            print("New Speed Drift mobile changes are not yet confirmed on public origin.",flush=True)
            sys.exit(1)
          print("PASS: Live Speed Drift mobile version confirmed.",flush=True)
          PY
