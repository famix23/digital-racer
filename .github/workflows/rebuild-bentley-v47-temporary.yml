name: Rebuild Bentley V4.7 catalog static pages (temporary)
on:
  push:
    branches:
      - catalog/bentley-v47-ten-cards-20261117
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: catalog/bentley-v47-ten-cards-20261117
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate every affected static page and sitemap
        run: python3 scripts/build_seo.py
      - name: Verify new cards and existing catalog relationships
        run: |
          python3 scripts/test_bentley_v47.py
          python3 scripts/test_indexing.py
          python3 scripts/test_shop_hubs.py
          python3 scripts/audit_product_seo.py
          python3 scripts/build_seo.py --check
      - name: Commit generated product pages to this feature branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Build ten Bentley 4.7 pages, 743-item catalog, hubs and canonical sitemap"
            git push origin HEAD:refs/heads/catalog/bentley-v47-ten-cards-20261117
          else
            echo "Generated catalog is already up to date."
          fi
